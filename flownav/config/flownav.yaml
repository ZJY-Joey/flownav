    test: /media/zjy/Elements SE/11111/UED_FLOW/sacson/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
    waypoint_spacing: 1  

  scand:
    data_folder: /media/zjy/Elements SE/11111/UED_FLOW/scand/
    train: /media/zjy/Elements SE/11111/UED_FLOW/scand/train/
    test: /media/zjy/Elements SE/11111/UED_FLOW/scand/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
    waypoint_spacing: 1  
    

# logging stuff
## =0 turns off
print_log_freq: 500 # in iterations
image_log_freq: 0 #0 # in iterations
num_images_log: 0 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.1
wandb_log_freq: 500 # in iterations
eval_freq: 5 # in epochs
selected_action_num_samples: 8
selected_action_cluster_threshold: 0.35
